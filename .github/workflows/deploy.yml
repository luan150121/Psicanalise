name: Publicar Falar e Escutar na Locaweb

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular sem alterar arquivos no servidor"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-falareescutar
  cancel-in-progress: false

jobs:
  deploy:
    name: Enviar site por FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do site
        uses: actions/checkout@v4

      - name: Enviar arquivos para a Locaweb
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./public_html/
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.simular }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            README.md
            LICENSE
